<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161923">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>X-Men Legends II</title>
<main id="setup">
  <p class="eyebrow">Native browser port</p>
  <h1>X-Men Legends II</h1>
  <p>Play using your own PC installation. Choose a ZIP containing the complete installation, including XMen2.exe and its game data.</p>
  <p>Your game files stay on this device. They are never uploaded.</p>
  <div class="actions">
    <label class="button">Choose game ZIP<input id="archive" type="file" accept=".zip,application/zip" disabled></label>
    <button id="play" disabled>Play saved installation</button>
  </div>
  <p id="status" role="status" aria-live="polite">Preparing browser storage…</p>
  <progress id="progress" hidden></progress>
  <p id="storage-note"></p>
  <button id="reload" hidden>Return to setup</button>
</main>
<canvas id="canvas" tabindex="0" aria-label="X-Men Legends II game"></canvas>
<script type="module" src="app.mjs"></script>
</html>
