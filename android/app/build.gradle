plugins {
    id "com.android.application"
}

import java.util.Properties

def propertiesPath = project.findProperty("x2NativeProperties")
if (!propertiesPath) {
    propertiesPath = System.getenv("X2_ANDROID_PROPERTIES")
}
if (!propertiesPath) {
    throw new GradleException(
        "x2-android.properties is not selected. Configure the Android CMake target first " +
        "and pass -Px2NativeProperties=<build>/x2-android.properties.")
}
def nativePropertiesFile = file(propertiesPath)
if (!nativePropertiesFile.isFile()) {
    throw new GradleException("Android native properties are missing: ${nativePropertiesFile}")
}
def nativeProperties = new Properties()
nativePropertiesFile.withInputStream { nativeProperties.load(it) }
def required = { String name ->
    def value = nativeProperties.getProperty(name)
    if (!value) throw new GradleException("Missing ${name} in ${nativePropertiesFile}")
    value
}

def nativeLibrary = file(required("x2.nativeLibrary"))
def sdlLibrary = file(required("x2.sdlLibrary"))
def cxxLibrary = file(required("x2.cxxLibrary"))
def androidAbi = required("x2.androidAbi")
def androidPlatform = required("x2.androidPlatform")
def ndkVersionValue = required("x2.ndkVersion")
def sdlJavaDir = file(required("x2.sdlJavaDir"))
def lucentJavaDir = file(required("x2.lucentJavaDir"))
def uiDir = file(required("x2.uiDir"))
def releaseKeystore = System.getenv("X2_ANDROID_KEYSTORE")
def releaseKeyAlias = System.getenv("X2_ANDROID_KEY_ALIAS")
def releaseStorePassword = System.getenv("X2_ANDROID_STORE_PASSWORD")
def releaseKeyPassword = System.getenv("X2_ANDROID_KEY_PASSWORD")
/* Release signing is deliberately absent for a debug-only local build, which
   must still configure. The release APK is refused instead at the two gates
   that own publication: tools/build_android.py refuses to start a release
   without all four values, and publish_apk refuses any unsigned artifact. */
def releaseSigned = [releaseKeystore, releaseKeyAlias,
                     releaseStorePassword, releaseKeyPassword].every { it }
def releaseKeystoreFile = releaseSigned ? file(releaseKeystore) : null
if (releaseSigned && !releaseKeystoreFile.isFile()) {
    throw new GradleException("Release keystore is missing: ${releaseKeystoreFile}")
}
def versionCodeValue = (System.getenv("X2_ANDROID_VERSION_CODE") ?: "2").toInteger()
def versionNameValue = System.getenv("X2_ANDROID_VERSION_NAME") ?: "0.2.0"
def sdkPath = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
if (!sdkPath) throw new GradleException("ANDROID_HOME or ANDROID_SDK_ROOT is not available")
if (!cxxLibrary.isFile())
    throw new GradleException("Shared Android C++ runtime is missing: ${cxxLibrary}")
if (!sdlJavaDir.isDirectory()) throw new GradleException("SDL Android Java sources are missing: ${sdlJavaDir}")
if (!lucentJavaDir.isDirectory()) throw new GradleException("Lucent Android Java sources are missing: ${lucentJavaDir}")
if (!uiDir.isDirectory()) throw new GradleException("Native UI assets are missing: ${uiDir}")

def stagedJniLibs = layout.buildDirectory.dir("generated/jniLibs/x2")
def stageJniLibs = tasks.register("stageX2JniLibs", Sync) {
    from(nativeLibrary) {
        rename { "libmain.so" }
        into(androidAbi)
    }
    from(cxxLibrary) {
        rename { "libc++_shared.so" }
        into(androidAbi)
    }
    from(sdlLibrary) {
        rename { "libSDL3.so" }
        into(androidAbi)
    }
    into(stagedJniLibs)
    doFirst {
        if (!nativeLibrary.isFile())
            throw new GradleException("Native library is missing: ${nativeLibrary}. Build x2native first.")
    }
}

def stagedAssets = layout.buildDirectory.dir("generated/assets/x2")
def syncAssets = tasks.register("syncX2Assets", Sync) {
    from(uiDir) { into("ui") }
    into(stagedAssets)
}

android {
    namespace = "com.someoneisworking.xmen2"
    compileSdk = 36
    ndkVersion = ndkVersionValue
    if (releaseSigned) {
        signingConfigs {
            release {
                storeFile = releaseKeystoreFile
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }
    defaultConfig {
        applicationId = "com.someoneisworking.xmen2"
        minSdk = androidPlatform.replaceFirst("^android-", "").toInteger()
        targetSdk = 36
        versionCode = versionCodeValue
        versionName = versionNameValue
    }
    buildTypes {
        debug { minifyEnabled = false }
        release {
            minifyEnabled = false
            if (releaseSigned) signingConfig = signingConfigs.release
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = [stagedJniLibs]
            assets.srcDirs = [stagedAssets]
            java.srcDirs += [sdlJavaDir, lucentJavaDir]
        }
    }
    splits {
        abi {
            enable = true
            reset()
            include androidAbi
            universalApk = false
        }
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}

tasks.named("preBuild").configure { dependsOn(stageJniLibs, syncAssets) }
