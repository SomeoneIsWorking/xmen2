name: Browser package

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-package
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout title
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Checkout shared browser dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SomeoneIsWorking/web-port
          ref: 14b2f87a5e69e3c9995ebdc3c821d96982963002
          path: vendor/shared/web-port
          fetch-depth: 1
          submodules: recursive
      - name: Checkout shared runtime dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SomeoneIsWorking/x86port
          ref: 2607945babec9ec667b5eef6b54232b704860cb7
          path: vendor/shared/x86port
          fetch-depth: 1
          submodules: recursive
      - name: Checkout shared Android build dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SomeoneIsWorking/android-port
          ref: c3e7807f9827aeb5aa4ed8cd368c97cf4df2f20d
          path: vendor/shared/android-port
          fetch-depth: 1
          submodules: recursive
      - name: Checkout shared cache dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SomeoneIsWorking/jit-common
          ref: 4c58336f5d187d556755c20c983b5dc168f8f9b1
          path: vendor/shared/jit-common
          fetch-depth: 1
          submodules: recursive
      - name: Checkout shared Alchemy dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SomeoneIsWorking/alchemy
          ref: b04e6657cac3156318506f4145a85e66b1ebc8e6
          path: vendor/shared/alchemy
          fetch-depth: 1
          submodules: recursive
      - name: Checkout shared assets
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SomeoneIsWorking/port-assets
          ref: b48abae76227a2f1fe17cc7d9abd60cc85d45e09
          path: vendor/shared/port-assets
          fetch-depth: 1
          submodules: recursive
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021
        with:
          version: 4.0.16
          actions-cache-folder: emsdk-cache
      - name: Install GLSL compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y glslc
      - name: Build pinned SPIR-V tools
        run: |
          git clone --filter=blob:none https://github.com/KhronosGroup/SPIRV-Tools.git vendor/spirv-tools
          git -C vendor/spirv-tools checkout --detach 685919f35dfbb8c2b50bf61412349a48d9fc6a37
          git clone --filter=blob:none https://github.com/KhronosGroup/SPIRV-Headers.git vendor/spirv-tools/external/spirv-headers
          git -C vendor/spirv-tools/external/spirv-headers checkout --detach 496543121ce6419f23d6fa5d7194ba66c36212d2
          cmake -S vendor/spirv-tools -B build/spirv-tools -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSPIRV_SKIP_TESTS=ON -DSPIRV_WERROR=OFF
          cmake --build build/spirv-tools --target spirv-as spirv-dis spirv-opt spirv-val --parallel 2
          echo "$GITHUB_WORKSPACE/build/spirv-tools/tools" >> "$GITHUB_PATH"
      - name: Build asset-free browser package
        run: uv run --frozen python tools/build_web.py --emsdk "$EMSDK" --jobs 2
      - name: Upload asset-free WASM package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xmen2-wasm-web
          path: build/release/web
          if-no-files-found: error
          include-hidden-files: true
