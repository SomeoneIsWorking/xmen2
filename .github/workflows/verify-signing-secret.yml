# Temporary: proves the signing keystore stored in repository secrets decodes
# and matches the published certificate. Prints only the public fingerprint.
name: Verify signing secret
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Decode and fingerprint
        env:
          KEYSTORE_BASE64: ${{ secrets.X2_ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.X2_ANDROID_KEY_ALIAS }}
          STOREPW: ${{ secrets.X2_ANDROID_STORE_PASSWORD }}
        run: |
          set -e
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > ks.jks
          ACTUAL=$(keytool -list -v -keystore ks.jks -storepass "$STOREPW" -alias "$ALIAS" \
                   | grep 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-Z' 'a-z')
          EXPECTED=$(python3 -c "import json;print(json.load(open('android/published-release.json'))['signer_sha256'])")
          rm -f ks.jks
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          echo "Signing secret decodes and matches the published identity."
