name: Release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.7)'
        required: false
        default: 'v0.1.7'

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.12"
  PYTHON_VERSION: "3.13"
  UV_FROZEN: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build-appimage:
    name: Linux AppImage (x86-64)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang-20 glslc libavcodec-dev libavformat-dev libavutil-dev \
            libfreetype-dev libgl-dev libglu1-mesa-dev libopengl-dev \
            libsdl3-dev libsdl3-image-dev libswresample-dev libswscale-dev \
            pkg-config ninja-build file curl
      - run: uv sync --frozen
      - name: Download AppImage packaging tools
        # Ubuntu's own patchelf is 0.18.0, which corrupts DT_INIT when it
        # rewrites current ELFs; the packager refuses anything below 0.19.
        run: |
          mkdir -p tools/bin
          curl -sL "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -o tools/bin/linuxdeploy
          chmod +x tools/bin/linuxdeploy
          curl -sL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o tools/bin/appimagetool
          chmod +x tools/bin/appimagetool
          curl -sL "https://github.com/NixOS/patchelf/releases/download/0.19.1/patchelf-0.19.1-x86_64.tar.gz" -o tools/bin/patchelf.tar.gz
          tar -xzf tools/bin/patchelf.tar.gz -C tools/bin --strip-components=2 ./bin/patchelf
          chmod +x tools/bin/patchelf
          tools/bin/patchelf --version
      - name: Build the native release binary
        run: CC=clang-20 CXX=clang++-20 uv run --frozen python tools/ci.py release-binary --target linux-x86_64
      - name: Package AppImage
        run: |
          mkdir -p build/release
          uv run --frozen python tools/package_appimage.py \
            --linuxdeploy tools/bin/linuxdeploy \
            --appimagetool tools/bin/appimagetool \
            --patchelf tools/bin/patchelf \
            --output build/release/X-Men-Legends-II-x86_64.AppImage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-appimage
          path: build/release/X-Men-Legends-II-x86_64.AppImage

  build-macos:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install native build dependencies
        # molten-vk and vulkan-loader are not build inputs: SDL_GPU is driven
        # from SPIR-V, so the shipped app carries its own Vulkan driver.
        run: brew install ffmpeg freetype pkg-config sdl3 sdl3_image shaderc ninja molten-vk vulkan-loader
      - name: Select the pinned Apple Clang toolchain
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - run: uv sync --frozen
      - name: Build the native release binary
        run: CC=clang CXX=clang++ uv run --frozen python tools/ci.py release-binary --target macos-arm64
      - name: Package the self-contained .app
        run: uv run --frozen python tools/package_macos.py
      - name: Zip the bundle
        # ditto, not the upload action's own zip: only ditto preserves the
        # symlinks and the ad-hoc signature a .app needs to launch.
        run: |
          cd build/release
          ditto -c -k --sequesterRsrc --keepParent "X-Men Legends II.app" X-Men-Legends-II-macos-arm64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-package
          path: build/release/X-Men-Legends-II-macos-arm64.zip

  build-android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y glslc ninja-build openjdk-21-jdk
      - run: uv sync --frozen
      - name: Ensure shared repositories
        run: uv run --frozen python -c "import bootstrap; bootstrap.ensure_shared()"
      # The APK is signed with the project's long-lived key, never with the
      # runner's auto-generated debug keystore. A debug key is regenerated per
      # machine, so every CI release used to carry a DIFFERENT signing identity:
      # Android then refused each update as "package conflicts with an existing
      # package", and the only way forward was uninstalling -- which deletes the
      # player's imported game installation, gigabytes they then had to import
      # again. build_android.py additionally refuses to publish an APK whose
      # signer does not match android/published-release.json.
      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.X2_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "X2_ANDROID_KEYSTORE_BASE64 is not configured; refusing to" \
                 "build an Android release that cannot update an installed copy." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
      - name: Set up NDK and build Android APK
        env:
          X2_ANDROID_KEY_ALIAS: ${{ secrets.X2_ANDROID_KEY_ALIAS }}
          X2_ANDROID_STORE_PASSWORD: ${{ secrets.X2_ANDROID_STORE_PASSWORD }}
          X2_ANDROID_KEY_PASSWORD: ${{ secrets.X2_ANDROID_KEY_PASSWORD }}
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export ANDROID_NDK_VERSION=$(ls "$ANDROID_HOME/ndk" | tail -n 1)
          export X2_ANDROID_KEYSTORE="$RUNNER_TEMP/signing/release.keystore"
          export X2_ANDROID_VERSION_CODE="${{ github.run_number }}"
          export X2_ANDROID_VERSION_NAME="${GITHUB_REF_NAME#v}"
          echo "Using NDK: $ANDROID_NDK_VERSION"
          uv run --frozen python tools/build_android.py --abi arm64-v8a
      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/signing/release.keystore"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-apk
          path: build/release/X-Men-Legends-II-arm64-v8a.apk

  publish:
    name: Publish GitHub Release
    needs: [build-appimage, build-macos, build-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
      - name: Prepare release files and checksums
        run: |
          mkdir -p release_assets
          find dist -type f -name "*.AppImage" -exec cp {} release_assets/ \;
          find dist -type f -name "*.zip" -exec cp {} release_assets/ \;
          find dist -type f -name "*.apk" -exec cp {} release_assets/ \;
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "val=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "val=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.val }}"
          echo "Publishing release for tag: $TAG"
          sed -e 's/^[ \t]*//' << 'EOF' > release_notes.md
          # X-Men Legends II Native Port Release

          Cross-platform native port of *X-Men Legends II: Rise of Apocalypse* (2005 PC release) using native subsystems and x86port runtime JIT.

          ### Release Assets:
          - **Linux x86-64 AppImage**: `X-Men-Legends-II-x86_64.AppImage`
            - Desktop no-terminal setup flow with Browse dialog.
            - Automatically verifies legal PC install and stores path in OS user config.
          - **macOS Apple Silicon (ARM64)**: `X-Men-Legends-II-macos-arm64.zip`
            - A self-contained `X-Men Legends II.app`: it carries SDL3, SDL3_image, FreeType, FFmpeg and its own Vulkan loader with MoltenVK, so nothing has to be installed first. Unzip it, move it to Applications and open it; the first launch asks for your PC installation with a Browse dialog and accepts a folder, its `XMen2.exe`, or a ZIP of either.
            - It is ad-hoc signed rather than notarised, so the first open needs right-click -> Open (or Open Anyway in System Settings -> Privacy & Security).
          - **Android ARM64 (arm64-v8a)**: `X-Men-Legends-II-arm64-v8a.apk`
            - Storage Access Framework setup and touch controls. Signed with the project's long-lived key, so it installs over any earlier release of the same lineage and keeps your imported game installation. Device performance is not yet measured.
          - **Checksums**: `SHA256SUMS.txt`

          ### Platform Notes:
          - **Windows**: no package. The native Windows host is not implemented, so there is nothing to build for it; on Windows the 2005 retail release runs on its own.
          - **No Copyrighted Assets**: These packages contain no game content, audio, textures, or retail code. Supply your own legally obtained PC installation of *X-Men Legends II* (folder or ZIP containing `XMen2.exe` and its original DLLs).
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_assets/* --clobber
          else
            gh release create "$TAG" release_assets/* \
              --title "X-Men Legends II native port $TAG" \
              --notes-file release_notes.md
          fi
