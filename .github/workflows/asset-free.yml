name: Asset-free verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-free-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.12"
  PYTHON_VERSION: "3.13"
  UV_FROZEN: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  EMSDK_VERSION: "4.0.16"

jobs:
  linux-x86_64:
    name: Linux x86-64 native and JIT components
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang-20 glslc libavcodec-dev libavformat-dev libavutil-dev libfreetype-dev libgl-dev libglu1-mesa-dev libopengl-dev libsdl3-dev libsdl3-image-dev libswresample-dev libswscale-dev pkg-config
      - run: uv sync --frozen
      - run: uv run --frozen python tools/ci.py policy --target linux-x86_64
      - run: CC=clang-20 CXX=clang++-20 uv run --frozen python tools/ci.py native-components --target linux-x86_64

  macos-arm64:
    name: Apple Silicon host components
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install native build dependencies
        run: brew install ffmpeg freetype pkg-config sdl3 sdl3_image shaderc
      - name: Select the pinned Apple Clang toolchain
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - run: uv sync --frozen
      - run: uv run --frozen python tools/ci.py policy --target macos-arm64
      - name: Compile platform-neutral native components
        run: CC=clang CXX=clang++ uv run --frozen python tools/ci.py native-components --target macos-arm64

  windows-x86_64:
    name: Windows x86-64 native and JIT components (llvm-mingw)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The runner image ships MSYS2. FFmpeg's configure needs its sh and make;
      # pkgconf reads the prefix's .pc files and glslc builds the shaders.
      # llvm-mingw and every library come from tools/windows_deps.py.
      - name: Install the Windows host build tools from MSYS2
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed make mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-shaderc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: uv sync --frozen
      - run: uv run --frozen python tools/ci.py policy --target windows-x86_64
      - run: uv run --frozen python tools/ci.py native-components --target windows-x86_64

  android-arm64-policy:
    name: Android ARM64 policy and native build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen python tools/ci.py policy --target android-arm64
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y glslc ninja-build
      - name: Ensure shared repositories
        run: uv run --frozen python -c "import bootstrap; bootstrap.ensure_shared()"
      # Android-only branches compile nowhere else; the release must not be
      # the first build to see them.
      - name: Build the Android native library
        run: |
          export ANDROID_NDK_VERSION=28.2.13676358
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          uv run --frozen python tools/build_android.py --abi arm64-v8a --no-assemble

  web-wasm-portability:
    name: Web WASM shared-runtime census
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # emsdk is installed from its own repository at a pinned SDK version
      # rather than through a third-party action, so no unreviewed action gains
      # access to the job.
      - name: Install the pinned Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git build/deps/emsdk
          build/deps/emsdk/emsdk install "${EMSDK_VERSION}"
          build/deps/emsdk/emsdk activate "${EMSDK_VERSION}"
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends ninja-build
      - run: uv sync --frozen
      - run: uv run --frozen python tools/ci.py policy --target web-wasm
      # This measures the shared runtime. Browser install, rendering, and
      # gameplay remain the title-specific S021 release gates.
      - run: uv run --frozen python tools/ci.py wasm-portability --target web-wasm
